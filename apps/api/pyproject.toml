[project]
name = "amplitude-lab-api"
version = "0.2.0"
description = "Amplitude Lab API — quantum simulation, curriculum delivery, sandboxed code execution."
requires-python = ">=3.12,<3.13"

# Core service dependencies. Deliberately excludes the quantum stack so the
# lightweight API (auth, progress, content) can deploy as a small function.
# See the `quantum` extra below — qiskit + qiskit-aer + scipy weigh ~234 MB,
# against Vercel's 250 MB per-function limit.
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
# The heavy simulation stack. Installed for local dev, the Docker API image,
# and the dedicated Vercel simulation function only.
quantum = [
    "qiskit>=1.2.0",
    "qiskit-aer>=0.15.0",
    "numpy>=1.26.0",
]
# ASGI server for local dev and the Docker image; Vercel supplies its own.
server = [
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "aiosqlite>=0.22.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "quantum: requires the qiskit extra to be installed",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
