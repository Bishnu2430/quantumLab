# Quantum Lab — full local stack.
# Managed through scripts/qlab (see `scripts/qlab help`).

name: quantum-lab

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantum}
      POSTGRES_DB: ${POSTGRES_DB:-quantumlab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api waits on this, so a slow first start never races the migrations.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantum} -d ${POSTGRES_DB:-quantumlab}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      # Repo root, so the curriculum artifact can be copied in.
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-quantum}:${POSTGRES_PASSWORD:-quantum}@db:5432/${POSTGRES_DB:-quantumlab}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    # The API starts one throwaway container per code execution, so it needs to
    # talk to the host daemon. This is docker-out-of-docker: the socket grants
    # effective root on the host, so the API container is trusted infrastructure
    # and the untrusted code runs in the container it spawns, never here.
    #
    # For a hostile multi-tenant deployment, replace this with a dedicated
    # executor service or a provider sandbox. Without the socket the API falls
    # back to the unsandboxed local runner and says so in the UI.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # The assistant's route runs in this container, not the API, so the key
      # has to reach here. Passing it only to `api` left the Copilot reporting
      # itself unconfigured while .env plainly had a key.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
